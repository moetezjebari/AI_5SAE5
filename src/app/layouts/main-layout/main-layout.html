<div class="shell">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <span class="material-symbols-outlined">school</span>
      <span>LMS Platform</span>
    </div>
    <nav>
      @for (g of groups; track g.title) {
        <div class="group-title">{{ g.title }}</div>
        @for (item of g.items; track item.path) {
          <a [routerLink]="item.path" [class.active]="isActive(item.path)" (click)="menuOpen.set(false)">
            <span class="material-symbols-outlined">{{ item.icon }}</span>
            {{ item.label }}
          </a>
        }
      }
    </nav>
  </aside>

  @if (menuOpen()) {
    <div class="backdrop" (click)="menuOpen.set(false)"></div>
  }

  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-btn" (click)="menuOpen.set(!menuOpen())" aria-label="Menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="spacer"></div>
      <button class="btn btn-icon" (click)="themeService.toggle()" aria-label="Changer de thème">
        <span class="material-symbols-outlined">{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</span>
      </button>
      <div class="user">
        <span class="avatar">{{ (user()?.firstName ?? 'E').charAt(0) }}</span>
        <span class="name">{{ user()?.firstName ?? 'Étudiant' }}</span>
      </div>
      <button class="btn btn-icon" (click)="logout()" aria-label="Déconnexion">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </header>
    <main class="content"><router-outlet /></main>
  </div>
</div>
