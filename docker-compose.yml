services:
  mysql:
    image: mysql:8.4
    container_name: lms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password
      MYSQL_ROOT_PASSWORD: lms_root_password
    ports:
      - '3306:3306'
    volumes:
      - lms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-plms_root_password']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lms_mysql_data:
